<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de Projetos</title>
<meta name="description" content="Gestão de projetos com macroentregas, TRL e relatórios — roda inteiramente no navegador.">
<link rel="stylesheet" href="assets/css/app.css?v=20261013">
</head>
<body>
<header class="topo">
  <div class="marca"><img src="assets/templates/logo_inovaagro_embrapii.png" alt=""><span>Gestão de Projetos</span></div>
  <div class="seletor">
    <button class="btn" id="btnProjetos" title="Abrir, criar ou importar projetos">📂 Projetos</button>
    <span id="localProjeto"></span>
  </div>
  <div class="acoes-topo">
    <span id="estadoSalvo" class="estado"></span>
    <button class="btn primario" id="btnSalvar" title="Salvar (Ctrl+S): grava o JSON e dispara o e-mail de andamento">💾 Salvar</button>
    <button class="btn" id="btnConfig" title="Configurações deste navegador (e-mail, seu nome)">⚙</button>
  </div>
</header>

<div class="corpo">
<aside class="lateral">
  <nav class="abas" id="abas">
    <button data-aba="projeto" class="ativa">🏠 Projeto</button>
    <button data-aba="equipe">👥 Equipe e Interessados</button>
    <button data-aba="areas">🧩 Áreas / Responsáveis</button>
    <button data-aba="macros">📦 Macroentregas</button>
    <button data-aba="produto">🛠 Projeto de produto/serviço</button>
    <button data-aba="cronograma">📅 Cronograma</button>
    <button data-aba="riscos">⚠️ Riscos</button>
    <button data-aba="qualidade">✅ Qualidade / DfX</button>
    <button data-aba="trl">📈 TRL</button>
    <button data-aba="licoes">💡 Lições aprendidas</button>
    <button data-aba="relatorios">📄 Relatórios e Exportação</button>
  </nav>
  <div class="inserir">
    <div class="rotulo">Inserir</div>
    <button class="btn" data-acao="nova-figura" title="Escolher uma imagem e inserir como figura (ABNT)">🖼 + Figura</button>
    <button class="btn" data-acao="nova-tabela" title="Criar uma tabela (ABNT)">▦ + Tabela</button>
  </div>
</aside>
<main id="conteudo" class="conteudo"><div class="boas-vindas">Carregando…</div></main>
</div>

<div id="modal" class="modal oculto" role="dialog" aria-modal="true">
  <div class="modal-caixa"><button class="modal-fechar" aria-label="Fechar">×</button><div id="modalCorpo"></div></div>
</div>
<div id="toasts" class="toasts"></div>

<noscript><p style="padding:20px">Este sistema precisa de JavaScript habilitado.</p></noscript>

<!-- bibliotecas locais (funcionam sem internet): pdfmake (PDF) e JSZip (ZIP) -->
<script src="lib/pdfmake.min.js?v=20261013"></script>
<script src="lib/vfs_fonts.js?v=20261013"></script>
<script src="lib/jszip.min.js?v=20261013"></script>
<!-- sistema -->
<script src="assets/js/config.js?v=20261013"></script>
<script src="assets/js/dfx.js?v=20261013"></script>
<script src="assets/js/trl_criterios.js?v=20261013"></script>
<script src="assets/js/nedip.js?v=20261013"></script>
<script src="assets/js/templates.js?v=20261013"></script>
<script src="assets/js/exemplo.js?v=20261013"></script>
<script src="assets/js/nucleo.js?v=20261013"></script>
<script src="assets/js/armazenamento.js?v=20261013"></script>
<script src="assets/js/email.js?v=20261013"></script>
<script src="assets/js/pdf.js?v=20261013"></script>
<script src="assets/js/app.js?v=20261013"></script>
<script src="assets/js/abas.js?v=20261013"></script>
<script src="assets/js/abnt.js?v=20261013"></script>
<script src="assets/js/macros.js?v=20261013"></script>
<script src="assets/js/gantt.js?v=20261013"></script>
<script src="assets/js/riscos.js?v=20261013"></script>
<script src="assets/js/trl.js?v=20261013"></script>
<script src="assets/js/produto.js?v=20261013"></script>
<script src="assets/js/formulario.js?v=20261013"></script>
<script src="assets/js/qfd.js?v=20261013"></script>
<script src="assets/js/blocos.js?v=20261013"></script>
<script src="assets/js/relatorios.js?v=20261013"></script>
<script>App.iniciar();</script>
</body>
</html>
